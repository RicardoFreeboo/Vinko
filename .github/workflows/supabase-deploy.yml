name: Supabase

# Despliegue de la base y las Edge Functions en cada cambio de supabase/** que
# llegue a main (y a mano desde Actions → Run). PARAMETRIZADO POR ENTORNO: el
# proyecto destino NO está hardcodeado, sale de la variable del repo/entorno
# SUPABASE_PROJECT_REF (Settings → Secrets and variables → Actions → Variables).
# Así el mismo workflow sirve para staging y prod; cada entorno de GitHub define
# su SUPABASE_PROJECT_REF, su SUPABASE_ACCESS_TOKEN y (opcional) su SUPABASE_DB_URL.
#
# Secretos/variables por entorno:
#   · vars.SUPABASE_PROJECT_REF  → ref del proyecto (p.ej. uarnpxjdccbidgzhhavc).
#       Si no se define, cae al ref histórico de prod (con aviso) para no romper
#       el despliegue existente; define la variable para staging.
#   · vars.MIGRATIONS_FROM       → primera migración a aplicar (default 72). Un
#       proyecto NUEVO desde cero usa 1 (o `supabase db reset`, ver RUNBOOK-INFRA).
#       Prod ya tiene hasta la 0071; desde 0060 (solo-puntos) las 0059/0064/0067
#       ya no se pueden re-aplicar, así que el umbral pasó de 55 a 72. Las ≥ 72
#       tienen que ser idempotentes: se re-aplican en cada deploy.
#   · secrets.SUPABASE_ACCESS_TOKEN → token personal (supabase.com/dashboard/account/tokens).
#   · secrets.SUPABASE_DB_URL (opcional) → "Session pooler" con contraseña: si está,
#       las migraciones van por psql; si no, por la Management API (/database/query).
#
# La base URL de las Edge Functions de ESTE proyecto se siembra en
# internal.config (functions_base_url) tras migrar, para que los crons despachen
# a SUS funciones y no a las de otro entorno (ver 0060).

on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-deploy.yml"
      - "scripts/deploy-edge.mjs"
  workflow_dispatch: {}

concurrency:
  group: supabase-deploy-${{ vars.SUPABASE_PROJECT_REF || 'prod' }}
  cancel-in-progress: false

env:
  # Ref del proyecto destino. Sin la variable, cae a prod (con aviso en el log).
  PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'uarnpxjdccbidgzhhavc' }}
  MIGRATIONS_FROM: ${{ vars.MIGRATIONS_FROM || '72' }}

jobs:
  migraciones:
    name: Migraciones + config del entorno
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Aviso si falta la variable de entorno
        run: |
          if [ -z "${{ vars.SUPABASE_PROJECT_REF }}" ]; then
            echo "::warning::vars.SUPABASE_PROJECT_REF no definida: usando el ref de prod ($PROJECT_REF). Defínela por entorno (Settings → Variables) para staging."
          fi
          echo "Destino: $PROJECT_REF · migraciones desde: $MIGRATIONS_FROM"

      - name: Aplicar migraciones
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$DB_URL" ] && [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Falta el secreto SUPABASE_ACCESS_TOKEN (supabase.com/dashboard/account/tokens) o SUPABASE_DB_URL."
            exit 1
          fi
          # Ejecuta un fichero SQL: psql directo si hay DB_URL; si no, Management API.
          run_sql_file() {
            if [ -n "$DB_URL" ]; then
              psql "$DB_URL" -v ON_ERROR_STOP=1 -q -f "$1"
            else
              code=$(jq -Rs '{query: .}' "$1" | curl -sS -o /tmp/resp.json -w "%{http_code}" \
                -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
                -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
                -H "Content-Type: application/json" -d @-)
              if [ "$code" -ge 300 ]; then
                echo "::error::Fallo aplicando $1 (HTTP $code):"; cat /tmp/resp.json; exit 1
              fi
            fi
          }
          applied=0
          for f in supabase/migrations/*.sql; do
            v=$(basename "$f" | cut -d_ -f1)
            if [ $((10#$v)) -ge $((10#$MIGRATIONS_FROM)) ]; then
              echo "→ aplicando $f"
              run_sql_file "$f"
              applied=$((applied+1))
            fi
          done
          echo "✓ $applied migración(es) aplicadas (desde $MIGRATIONS_FROM)."

      - name: Sembrar la base URL de las Edge Functions de este entorno
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          # Los crons (0060) construyen la URL desde internal.config; si no está,
          # NO despachan (lo registran) en vez de llamar a otro proyecto. Aquí se
          # fija a las funciones de ESTE ref.
          cat > /tmp/seed-config.sql <<SQL
          insert into internal.config(key, value)
            values ('functions_base_url', 'https://$PROJECT_REF.supabase.co/functions/v1')
          on conflict (key) do update set value = excluded.value;
          SQL
          if [ -n "$DB_URL" ]; then
            psql "$DB_URL" -v ON_ERROR_STOP=1 -q -f /tmp/seed-config.sql
          else
            code=$(jq -Rs '{query: .}' /tmp/seed-config.sql | curl -sS -o /tmp/resp.json -w "%{http_code}" \
              -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" -d @-)
            [ "$code" -lt 300 ] || { echo "::error::Fallo sembrando functions_base_url (HTTP $code):"; cat /tmp/resp.json; exit 1; }
          fi
          echo "✓ internal.config.functions_base_url → https://$PROJECT_REF.supabase.co/functions/v1"

      - name: Verificar que las piezas existen
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          cat > /tmp/verify.sql <<'SQL'
          do $$
          declare f text; missing text := '';
          begin
            foreach f in array array['me','set_tz','set_handle','user_today','create_porra',
                                     'make_guest_pick','porra_settle','propose_result',
                                     'group_porras','cron_admin_digest','cron_editorial_expire',
                                     'cron_season_rotate','notify_social_direct'] loop
              if not exists (select 1 from pg_proc p join pg_namespace n on n.oid = p.pronamespace
                              where n.nspname = 'public' and p.proname = f) then
                missing := missing || ' ' || f;
              end if;
            end loop;
            if missing <> '' then
              raise exception 'Faltan funciones:%', missing;
            end if;
          end $$;
          select jobname, schedule from cron.job order by jobname;
          SQL
          if [ -n "$DB_URL" ]; then
            psql "$DB_URL" -v ON_ERROR_STOP=1 -f /tmp/verify.sql
          else
            code=$(jq -Rs '{query: .}' /tmp/verify.sql | curl -sS -o /tmp/resp.json -w "%{http_code}" \
              -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" -d @-)
            if [ "$code" -ge 300 ]; then
              echo "::error::La verificación falló (HTTP $code):"; cat /tmp/resp.json; exit 1
            fi
            echo "Cron jobs en la base:"; cat /tmp/resp.json
          fi
          echo "✓ Todas las funciones del S0/S1/S2 están en la base."

  funciones:
    name: Edge Functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Desplegar TODAS las Edge Functions del producto
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'uarnpxjdccbidgzhhavc' }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Falta el secreto SUPABASE_ACCESS_TOKEN (supabase.com/dashboard/account/tokens)."
            exit 1
          fi
          # Todas las funciones que usa el producto, con su verify_jwt (coincide con
          # supabase/config.toml). money-webhook queda FUERA (dinero, rama aparte).
          #   verify_jwt=true  → account-purge, rewards-claim (sesión de usuario)
          #   verify_jwt=false → push-dispatch, trend-generate, voice-porra (validan
          #                      el x-cron-secret), billing-webhook (firma de Stripe)
          #
          # Desplegar funciones usa la Management API, que exige que el token tenga
          # rol Owner/Administrator. Si NO lo tiene (403 «necessary privileges»),
          # NO rompemos el deploy: las migraciones de BD ya se aplicaron en su job,
          # y un deploy siempre-rojo por un permiso que falta solo entrena a ignorar
          # CI. Avisamos fuerte y salimos 0. Cualquier OTRO fallo (código, red) sí
          # rompe. Con un token de Owner, se despliegan las 6 y el aviso desaparece.
          log="$(mktemp)"
          ok=1
          node scripts/deploy-edge.mjs push-dispatch            2>&1 | tee -a "$log"; [ "${PIPESTATUS[0]}" = 0 ] || ok=0
          node scripts/deploy-edge.mjs account-purge --verify-jwt 2>&1 | tee -a "$log"; [ "${PIPESTATUS[0]}" = 0 ] || ok=0
          node scripts/deploy-edge.mjs billing-webhook          2>&1 | tee -a "$log"; [ "${PIPESTATUS[0]}" = 0 ] || ok=0
          node scripts/deploy-edge.mjs rewards-claim --verify-jwt 2>&1 | tee -a "$log"; [ "${PIPESTATUS[0]}" = 0 ] || ok=0
          node scripts/deploy-edge.mjs trend-generate           2>&1 | tee -a "$log"; [ "${PIPESTATUS[0]}" = 0 ] || ok=0
          node scripts/deploy-edge.mjs voice-porra              2>&1 | tee -a "$log"; [ "${PIPESTATUS[0]}" = 0 ] || ok=0
          if [ "$ok" = 1 ]; then
            echo "✓ Edge Functions desplegadas en $SUPABASE_PROJECT_REF."
            exit 0
          fi
          if grep -q "necessary privileges" "$log"; then
            echo "::warning::Edge Functions NO desplegadas: SUPABASE_ACCESS_TOKEN sin rol Owner/Administrator (403). La BD sí se aplicó. Pon un token de Owner para habilitar el deploy de funciones (ver RUNBOOK-INFRA.md)."
            exit 0
          fi
          echo "::error::Fallo desplegando alguna Edge Function (no fue por permisos). Revisa el log de arriba."
          exit 1
