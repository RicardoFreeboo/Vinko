name: Supabase

# Re-disparo 3-oct-2026: en producción faltaban stake_kind/stake_text/listed y
# create_porra (migraciones 0057/0058 del Reto). El creador caía al fallback
# legacy → se perdían el premio y el pick del creador. Este push re-aplica las
# migraciones idempotentes ≥0055 para cerrar ese hueco.
#
# Despliegue automático de la base y las Edge Functions en cada cambio de
# supabase/** que llegue a main (y a mano desde la pestaña Actions → Run).
#
# Necesita UN secreto del repositorio (Settings → Secrets and variables →
# Actions → New repository secret):
#   · SUPABASE_ACCESS_TOKEN → token personal (supabase.com/dashboard/account/tokens).
# Con él se aplican las migraciones (Management API, /database/query) y se
# despliegan las funciones (CLI). Si además existe SUPABASE_DB_URL (cadena
# "Session pooler" con contraseña), las migraciones van por psql directo.
#
# Las migraciones ≥ 0055 son IDEMPOTENTES por diseño (nota v1.0 §5): re-aplicarlas
# no rompe nada, así que este workflow las pasa todas en orden en cada ejecución.
# Las < 0055 ya están aplicadas en producción y NO se tocan.

on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-deploy.yml"
  workflow_dispatch: {}

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  migraciones:
    name: Migraciones (≥ 0055)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Aplicar migraciones idempotentes
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: uarnpxjdccbidgzhhavc
        run: |
          if [ -z "$DB_URL" ] && [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Falta el secreto SUPABASE_ACCESS_TOKEN. Créalo en supabase.com/dashboard/account/tokens (Generate new token) y pégalo en GitHub: Settings → Secrets and variables → Actions → New repository secret."
            exit 1
          fi
          # Ejecuta un fichero SQL: psql directo si hay DB_URL; si no, Management API.
          run_sql_file() {
            if [ -n "$DB_URL" ]; then
              psql "$DB_URL" -v ON_ERROR_STOP=1 -q -f "$1"
            else
              code=$(jq -Rs '{query: .}' "$1" | curl -sS -o /tmp/resp.json -w "%{http_code}" \
                -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
                -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
                -H "Content-Type: application/json" -d @-)
              if [ "$code" -ge 300 ]; then
                echo "::error::Fallo aplicando $1 (HTTP $code):"
                cat /tmp/resp.json
                exit 1
              fi
            fi
          }
          applied=0
          for f in supabase/migrations/*.sql; do
            v=$(basename "$f" | cut -d_ -f1)
            if [ $((10#$v)) -ge 55 ]; then
              echo "→ aplicando $f"
              run_sql_file "$f"
              applied=$((applied+1))
            fi
          done
          echo "✓ $applied migración(es) aplicadas (idempotentes)."

      - name: Verificar que las piezas existen
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: uarnpxjdccbidgzhhavc
        run: |
          cat > /tmp/verify.sql <<'SQL'
          do $$
          declare f text; missing text := '';
          begin
            foreach f in array array['me','set_tz','set_handle','user_today','create_porra',
                                     'make_guest_pick','porra_settle','propose_result',
                                     'group_porras','cron_admin_digest','cron_editorial_expire',
                                     'cron_season_rotate','notify_social_direct'] loop
              if not exists (select 1 from pg_proc p join pg_namespace n on n.oid = p.pronamespace
                              where n.nspname = 'public' and p.proname = f) then
                missing := missing || ' ' || f;
              end if;
            end loop;
            if missing <> '' then
              raise exception 'Faltan funciones:%', missing;
            end if;
          end $$;
          select jobname, schedule from cron.job order by jobname;
          SQL
          if [ -n "$DB_URL" ]; then
            psql "$DB_URL" -v ON_ERROR_STOP=1 -f /tmp/verify.sql
          else
            code=$(jq -Rs '{query: .}' /tmp/verify.sql | curl -sS -o /tmp/resp.json -w "%{http_code}" \
              -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" -d @-)
            if [ "$code" -ge 300 ]; then
              echo "::error::La verificación falló (HTTP $code):"
              cat /tmp/resp.json
              exit 1
            fi
            echo "Cron jobs en la base:"
            cat /tmp/resp.json
          fi
          echo "✓ Todas las funciones del S0/S1/S2 están en la base."

  funciones:
    name: Edge Functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Desplegar push-dispatch y account-purge
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Falta el secreto SUPABASE_ACCESS_TOKEN. Créalo en supabase.com/dashboard/account/tokens (Generate new token) y pégalo en GitHub: Settings → Secrets and variables → Actions."
            exit 1
          fi
          supabase functions deploy push-dispatch --project-ref uarnpxjdccbidgzhhavc
          supabase functions deploy account-purge --project-ref uarnpxjdccbidgzhhavc
          echo "✓ Edge Functions desplegadas."
