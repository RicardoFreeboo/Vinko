name: CI
# Regresión automática (nació de dos caídas del feed en una semana):
#   check → léxico prohibido · paridad i18n · tests unitarios · tsc · build
#   e2e   → smoke contra producción (solo lectura). Corre en push a main, a
#           mano (workflow_dispatch) y cuando Vercel marca el deploy de
#           Production como exitoso (deployment_status) — este último es el
#           fiable: el de push puede llegar antes de que termine el deploy.
# Sin secretos: el build funciona con las variables de Supabase vacías.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  deployment_status:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Gate completo (predeploy + SQL)
    if: github.event_name != 'deployment_status'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # tests/sql/run.sh levanta un Postgres efímero (initdb/pg_ctl). En los
      # runners de GitHub ya viene postgresql-16; si faltara, se instala.
      - name: Asegurar Postgres (para tests/sql)
        run: |
          if ! ls -d /usr/lib/postgresql/*/bin >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y postgresql
          fi
          ls -d /usr/lib/postgresql/*/bin

      # Gate COMPLETO, reutilizando scripts/predeploy.mjs:
      #   léxico → términos prohibidos → i18n → unit → invariante de esquema →
      #   SQL (migraciones desde cero + tests) → ESLint → tsc → build de Next.
      # Todo bloquea el merge: si un paso falla, el job falla.
      - name: Predeploy (gate completo)
        run: node scripts/predeploy.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ""
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ""
          NEXT_PUBLIC_LEGAL_LOCK: "true"
          NEXT_PUBLIC_ADS_ENABLED: "false"
          NEXT_TELEMETRY_DISABLED: "1"

  e2e:
    name: Smoke en producción (www.vinko.fun)
    needs: check
    if: >-
      ${{ !cancelled()
          && (needs.check.result == 'success' || needs.check.result == 'skipped')
          && (
            github.event_name == 'workflow_dispatch'
            || (github.event_name == 'push' && github.ref == 'refs/heads/main')
            || (github.event_name == 'deployment_status'
                && github.event.deployment_status.state == 'success'
                && github.event.deployment.environment == 'Production')
          ) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Navegador (chromium de Playwright)
        run: npx playwright install --with-deps chromium
      - name: Smoke E2E
        run: node tests/e2e/smoke.mjs
        env:
          BASE_URL: https://www.vinko.fun
          CI: "true"
