<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b12">
<title>Vinko — porras con amigos</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
/* ============ Vinko v1 web — mobile-first (430px frame) ============ */
:root{
  --bg:#0b0b12; --bg2:#12121c; --card:#171725; --line:#262638;
  --tx:#f4f4fa; --tx2:#9a9ab0; --acc:#7c4dff; --acc2:#00e0b8;
  --gold:#ffc44d; --danger:#ff5470; --ok:#2fd573;
  --navh:62px; --toph:54px;
  /* z-index scale: nav SIEMPRE encima de todo (regla del repo) */
  --z-view:10; --z-sheet:500; --z-nav:9999; --z-modal:10500; --z-toast:11000;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:#050508;color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#frame{position:relative;margin:0 auto;width:100%;max-width:430px;height:100dvh;background:var(--bg);overflow:hidden;box-shadow:0 0 60px rgba(124,77,255,.15)}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font:inherit}
::-webkit-scrollbar{display:none}

/* ---------- top bar ---------- */
#topbar{position:absolute;top:0;left:0;right:0;height:var(--toph);z-index:var(--z-nav);display:flex;align-items:center;gap:8px;padding:0 12px;background:linear-gradient(180deg,rgba(5,5,8,.92),rgba(5,5,8,0));pointer-events:none}
#topbar>*{pointer-events:auto}
.logo{font-weight:800;font-size:20px;letter-spacing:-.5px;background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.chips{display:flex;gap:6px;margin-left:auto}
.chip{display:flex;align-items:center;gap:4px;background:rgba(23,23,37,.85);border:1px solid var(--line);border-radius:999px;padding:5px 10px;font-size:13px;font-weight:700;backdrop-filter:blur(6px)}
.chip small{font-weight:400;color:var(--tx2)}

/* ---------- views ---------- */
.view{position:absolute;inset:0;z-index:var(--z-view);display:none;overflow-y:auto;padding:calc(var(--toph) + 6px) 14px calc(var(--navh) + 16px)}
.view.on{display:block}
#view-feed{display:none;padding:0}
#view-feed.on{display:block}
.vtitle{font-size:22px;font-weight:800;margin:8px 2px 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.muted{color:var(--tx2);font-size:12.5px;line-height:1.45}
.sep{height:1px;background:var(--line);margin:12px 0}

/* ---------- feed (snap vertical, un vídeo por porra) ---------- */
#feed{height:100%;overflow-y:auto;scroll-snap-type:y mandatory}
.pool{position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
.vid{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:84px;animation:drift 16s ease-in-out infinite alternate}
@keyframes drift{0%{transform:scale(1)}100%{transform:scale(1.09)}}
.pool.off .vid{animation-play-state:paused}
.vv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
@media (prefers-reduced-motion:reduce){.vid{animation:none}}
.vid .mk{position:absolute;bottom:46%;left:0;right:0;text-align:center;font-size:12px;color:rgba(255,255,255,.94);letter-spacing:.4px;text-shadow:0 1px 6px rgba(0,0,0,.85)}
.pool .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,5,8,.25) 0%,rgba(5,5,8,0) 30%,rgba(5,5,8,.82) 78%)}
.pcontent{position:relative;padding:0 74px calc(var(--navh) + 14px) 14px;display:flex;flex-direction:column;gap:9px}
.author{display:flex;align-items:center;gap:8px}
.av{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:#fff;flex-shrink:0;border:2px solid rgba(255,255,255,.35)}
.author .h{font-weight:700;font-size:14px}
.author .lvl{font-size:11px;color:var(--acc2);border:1px solid rgba(0,224,184,.4);border-radius:999px;padding:1px 7px}
.q{font-size:19px;font-weight:800;line-height:1.25;text-shadow:0 1px 8px rgba(0,0,0,.5)}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.22);border-radius:12px;padding:9px 12px;font-size:14px;font-weight:600;text-align:left;background:rgba(10,10,18,.68)}
.opt .bar{position:absolute;inset:0;width:0%;background:linear-gradient(90deg,rgba(124,77,255,.4),rgba(0,224,184,.28));transition:width .5s}
.opt .lab{position:relative;display:flex;justify-content:space-between;gap:8px}
.opt.sel{border-color:var(--acc2);box-shadow:0 0 0 1px var(--acc2)}
.meta{display:flex;gap:12px;font-size:12.5px;color:#cfcfe2}
.meta b{color:var(--gold)}
.cta{background:linear-gradient(90deg,var(--acc),#5e35b1);border-radius:14px;padding:13px;font-size:16px;font-weight:800;text-align:center;box-shadow:0 6px 22px rgba(124,77,255,.4)}
.cta.done{background:var(--card);border:1px solid var(--ok);color:var(--ok);box-shadow:none}
.aff{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--tx2);background:rgba(10,10,18,.5);border:1px dashed rgba(255,255,255,.2);border-radius:10px;padding:7px 10px}
.aff b{color:var(--tx)}
.badge18{flex-shrink:0;border:1.5px solid var(--danger);color:var(--danger);border-radius:6px;font-weight:800;font-size:10px;padding:1px 5px}
.rail{position:absolute;right:10px;bottom:calc(var(--navh) + 20px);display:flex;flex-direction:column;align-items:center;gap:16px;z-index:2}
.rail .rbtn{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.rail .rbtn .ic{font-size:26px}
.rail .rbtn.liked .ic{filter:drop-shadow(0 0 6px var(--danger))}
.resband{position:relative;background:rgba(47,213,115,.15);border:1px solid var(--ok);color:var(--ok);border-radius:10px;padding:7px 10px;font-size:12.5px;font-weight:700}
.resband.lost{background:rgba(255,84,112,.12);border-color:var(--danger);color:var(--danger)}
.flash{position:relative;align-self:flex-start;background:var(--gold);color:#221a00;font-size:11px;font-weight:800;border-radius:999px;padding:3px 9px}

/* ---------- nav (SIEMPRE encima) ---------- */
#tabbar{position:absolute;left:0;right:0;bottom:0;height:var(--navh);z-index:var(--z-nav);display:flex;align-items:stretch;background:rgba(9,9,15,.96);border-top:1px solid var(--line);backdrop-filter:blur(10px)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10.5px;color:var(--tx2)}
.tab .ic{font-size:21px;line-height:1}
.tab.on{color:var(--tx)}
.tab.on .ic{filter:drop-shadow(0 0 8px var(--acc))}
.tab.mk{position:relative}
.tab.mk .ic{width:42px;height:30px;border-radius:10px;background:linear-gradient(90deg,var(--acc),var(--acc2));display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px}

/* ---------- sheets (encima del viewer, debajo del nav) ---------- */
.sheet{position:absolute;left:0;right:0;bottom:var(--navh);max-height:72%;z-index:var(--z-sheet);background:var(--bg2);border-radius:18px 18px 0 0;border:1px solid var(--line);border-bottom:none;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
.sheet.open{transform:translateY(0)}
.sh-head{display:flex;align-items:center;gap:10px;padding:14px 16px 10px}
.sh-head h3{font-size:16px;flex:1}
.sh-x{color:var(--tx2);font-size:20px;padding:4px 8px}
.sh-body{overflow-y:auto;padding:0 16px 18px;display:flex;flex-direction:column;gap:10px}
.stake{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 13px;font-size:14px}
.btn{background:linear-gradient(90deg,var(--acc),#5e35b1);border-radius:13px;padding:13px;font-weight:800;font-size:15px;text-align:center}
.btn.ghost{background:var(--card);border:1px solid var(--line)}
.btn.mini{padding:8px 12px;font-size:13px;border-radius:10px}
.btn.ok{border-color:var(--ok);color:var(--ok)}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px;margin-bottom:12px}
.segb{flex:1;padding:9px;border-radius:9px;font-weight:700;font-size:13.5px;color:var(--tx2)}
.segb.on{background:linear-gradient(90deg,var(--acc),#5e35b1);color:#fff}
.vrow{display:flex;gap:8px}
.vrow input{flex:1;min-width:0}
.micbtn{width:46px;flex-shrink:0;border-radius:11px;background:var(--card);border:1px solid var(--line);font-size:19px}
.micbtn.rec{background:var(--danger);border-color:var(--danger);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.55}}
.frow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 10px;border-radius:11px;border:1px solid transparent}
.frow.sel{border-color:var(--acc2);background:rgba(0,224,184,.08)}
.frow .fn{flex:1;font-weight:600;font-size:14px}
.frow .fp{color:var(--tx2);font-size:12px}
.duelst{font-size:12px;font-weight:700}
.sbtn{display:flex;align-items:center;gap:12px;border-radius:13px;padding:12px 16px;font-weight:700;font-size:14.5px;border:1px solid var(--line);background:var(--card);width:100%;text-align:left}
.sbtn svg{width:20px;height:20px;flex-shrink:0}
.sbtn.google{background:#fff;color:#1a1a1a;border-color:#fff}
.sbtn.apple,.sbtn.x,.sbtn.tiktok{background:#000;color:#fff;border-color:#333}
.btn[disabled]{opacity:.45}
.cmt{display:flex;gap:9px;align-items:flex-start}
.cmt .tx{background:var(--card);border-radius:0 12px 12px 12px;padding:8px 11px;font-size:13.5px}
.cmt .who{font-size:11px;color:var(--tx2);margin-bottom:2px}
.cmtrow{display:flex;gap:8px;padding-top:4px}
.cmtrow input{flex:1;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:10px 14px;color:var(--tx);outline:none}

/* ---------- modals ---------- */
.modal{position:absolute;inset:0;z-index:var(--z-modal);display:none;align-items:center;justify-content:center;background:rgba(4,4,8,.72);backdrop-filter:blur(4px);padding:24px}
.modal.open{display:flex}
.mbox{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:12px;text-align:center}
.mbox h3{font-size:18px}
.mbox .big{font-size:44px}

/* ---------- toast ---------- */
#toast{position:absolute;left:50%;bottom:calc(var(--navh) + 18px);transform:translateX(-50%) translateY(20px);z-index:var(--z-toast);background:#1d1d2e;border:1px solid var(--line);border-radius:999px;padding:10px 18px;font-size:13.5px;font-weight:600;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- confetti (se autolimpia; bug histórico) ---------- */
#confetti{position:absolute;inset:0;z-index:var(--z-toast);pointer-events:none;overflow:hidden}
.cf{position:absolute;width:8px;height:12px;top:-14px;animation:fall 1.4s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:0}}

/* ---------- retos / racha ---------- */
.streakcal{display:flex;gap:6px;justify-content:space-between}
.dayb{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 0;font-size:11px;color:var(--tx2)}
.dayb.hit{border-color:var(--acc);color:var(--tx)}
.dayb .f{font-size:16px}
.reto{display:flex;align-items:center;gap:11px}
.reto .info{flex:1}
.reto .name{font-size:14px;font-weight:700}
.pbar{height:6px;background:var(--line);border-radius:99px;margin-top:6px;overflow:hidden}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:99px}
.pts{color:var(--gold);font-weight:800;font-size:13px;white-space:nowrap}

/* ---------- liga / premios ---------- */
.prize{display:flex;align-items:center;gap:12px}
.prize .pos{width:52px;font-weight:800;color:var(--gold);font-size:13px}
.prize .nm{flex:1;font-size:14px;font-weight:600}
.prize .sp{font-size:11px;color:var(--tx2)}
.trow{display:flex;align-items:center;gap:10px;padding:7px 4px;font-size:13.5px;border-bottom:1px solid var(--line)}
.trow:last-child{border-bottom:none}
.trow .rk{width:26px;color:var(--tx2);font-weight:700}
.trow .nm{flex:1;display:flex;align-items:center;gap:8px}
.trow .sc{font-weight:800}
.trow.me{background:rgba(124,77,255,.12);border-radius:8px}
.trow.up .rk{color:var(--ok)}
.trow.down .rk{color:var(--danger)}

/* ---------- grupos ---------- */
.gitem{display:flex;align-items:center;gap:12px}
.gava{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;background:var(--bg)}
.gitem .gi{flex:1}
.gitem .gn{font-weight:700;font-size:15px}
.ledger .trow .nm{flex-direction:column;align-items:flex-start;gap:1px}
.st{font-size:10.5px;border-radius:6px;padding:2px 7px;font-weight:700}
.st.pend{background:rgba(255,196,77,.15);color:var(--gold)}
.st.paid{background:rgba(47,213,115,.15);color:var(--ok)}

/* ---------- perfil ---------- */
.pstats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.pstats .card{padding:10px 4px;margin:0}
.pstats b{font-size:17px;display:block}
.pstats small{color:var(--tx2);font-size:10.5px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.g3{aspect-ratio:9/13;border-radius:10px;display:flex;align-items:flex-end;padding:7px;font-size:10.5px;font-weight:700;line-height:1.2;background-size:cover;position:relative;overflow:hidden;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.7)}
.g3 .r{position:absolute;top:5px;right:5px;font-size:13px}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
.setrow:last-child{border-bottom:none}
.setrow select{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:9px;padding:7px 10px}
.sw{width:44px;height:26px;border-radius:99px;background:var(--line);position:relative;transition:.2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--acc)}
.sw.on::after{left:21px}

/* ---------- crear ---------- */
.f{display:flex;flex-direction:column;gap:6px}
.f label{font-size:12.5px;color:var(--tx2);font-weight:600}
.f input,.f select,.f textarea{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:11px 13px;color:var(--tx);outline:none}
.optin{display:flex;gap:8px;margin-bottom:8px}
.optin input{flex:1}
video#camprev{width:100%;border-radius:14px;background:#000;aspect-ratio:9/14;object-fit:cover}
@media (min-width:431px){body{display:flex;align-items:center}}
</style>
</head>
<body>
<div id="frame">
  <header id="topbar">
    <span class="logo">vinko</span>
    <div class="chips">
      <button class="chip" id="chip-streak" onclick="go('retos')">🔥 <span id="c-streak">0</span></button>
      <button class="chip" onclick="go('premios')">🎯 <span id="c-prec">0</span></button>
      <button class="chip" id="chip-pts">🪙 <span id="c-pts">0</span></button>
    </div>
  </header>

  <!-- FEED -->
  <section class="view on" id="view-feed"><div id="feed"></div></section>

  <!-- RETOS / RACHA -->
  <section class="view" id="view-retos">
    <h2 class="vtitle" data-i18n="retos.title"></h2>
    <div class="card">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
        <div style="font-size:34px">🔥</div>
        <div style="flex:1"><b id="streak-line"></b><div class="muted" id="streak-mult"></div></div>
      </div>
      <div class="streakcal" id="streakcal"></div>
    </div>
    <h3 class="vtitle" style="font-size:16px" data-i18n="retos.daily"></h3>
    <div id="retolist"></div>
    <h3 class="vtitle" style="font-size:16px" data-i18n="retos.refs"></h3>
    <div class="card">
      <div class="reto"><div class="info">
        <div class="name" data-i18n="refs.invite"></div>
        <div class="muted" data-i18n="refs.expl"></div>
      </div><span class="pts">+300 🪙</span></div>
      <div class="sep"></div>
      <div class="muted" id="refs-status"></div>
      <div style="height:10px"></div>
      <button class="btn" onclick="inviteFriend()" data-i18n="refs.cta"></button>
    </div>
    <p class="muted" style="margin-top:10px" data-i18n="retos.legal"></p>
  </section>

  <!-- CREAR -->
  <section class="view" id="view-crear">
    <h2 class="vtitle" data-i18n="crear.title"></h2>
    <div class="seg">
      <button class="segb on" id="seg-porra" onclick="crearMode('porra')" data-i18n="crear.tabPorra"></button>
      <button class="segb" id="seg-reto" onclick="crearMode('reto')" data-i18n="duel.tab"></button>
    </div>
    <div class="card f" id="crear-reto" style="display:none">
      <label for="dq" data-i18n="duel.q"></label>
      <div class="vrow"><input id="dq" maxlength="90" data-i18n-ph="duel.qph"><button class="micbtn" id="dq-mic" data-i18n-al="duel.voice" onclick="startVoice('dq')">🎙️</button></div>
      <label data-i18n="duel.rival"></label>
      <div id="rivallist"></div>
      <button class="btn ghost" onclick="inviteFriend()" data-i18n="refs.cta300"></button>
      <label data-i18n="duel.judge"></label>
      <p class="muted" style="margin-top:-2px" data-i18n="duel.judgeHint"></p>
      <div id="judgelist"></div>
      <label for="dentry" data-i18n="duel.entry"></label>
      <select id="dentry"><option>10</option><option selected>25</option><option>50</option></select>
      <div style="height:4px"></div>
      <button class="btn" onclick="createDuel()" data-i18n="duel.cta"></button>
    </div>
    <div class="card f" id="crear-porra">
      <label for="nq" data-i18n="crear.q"></label>
      <div class="vrow"><input id="nq" maxlength="90" data-i18n-ph="crear.qph"><button class="micbtn" id="nq-mic" data-i18n-al="duel.voice" onclick="startVoice('nq')">🎙️</button></div>
      <label for="no1" data-i18n="crear.opts"></label>
      <div class="optin"><input id="no1" maxlength="24" placeholder="A"><input id="no2" maxlength="24" placeholder="B"></div>
      <label for="nentry" data-i18n="crear.entry"></label>
      <select id="nentry"><option>10</option><option selected>25</option><option>50</option></select>
      <label for="ncloses" data-i18n="crear.closes"></label>
      <select id="ncloses"><option value="1" data-i18n="crear.h1"></option><option value="24" selected data-i18n="crear.h24"></option><option value="72" data-i18n="crear.h72"></option></select>
      <div style="height:4px"></div>
      <button class="btn ghost" id="recbtn" onclick="openRec()">🎥 <span data-i18n="crear.rec"></span></button>
      <button class="btn" onclick="createPool()" data-i18n="crear.cta"></button>
      <p class="muted" data-i18n="crear.hint"></p>
    </div>
  </section>

  <!-- GRUPOS -->
  <section class="view" id="view-grupos">
    <div id="glist">
      <h2 class="vtitle" data-i18n="grupos.title"></h2>
      <div id="groups"></div>
      <p class="muted" data-i18n="grupos.legal"></p>
    </div>
    <div id="gdetail" style="display:none"></div>
  </section>

  <!-- PREMIOS / LIGA -->
  <section class="view" id="view-premios">
    <h2 class="vtitle" data-i18n="liga.title"></h2>
    <div class="card">
      <b id="liga-div"></b>
      <div class="muted" data-i18n="liga.expl"></div>
    </div>
    <h3 class="vtitle" style="font-size:16px" data-i18n="liga.prizes"></h3>
    <div class="card" id="prizelist"></div>
    <p class="muted" data-i18n="liga.legalnote"></p>
    <h3 class="vtitle" style="font-size:16px" data-i18n="liga.standings"></h3>
    <div class="card" id="standings"></div>
  </section>

  <!-- PERFIL -->
  <section class="view" id="view-perfil">
    <div style="display:flex;align-items:center;gap:14px;margin:8px 0 14px">
      <div class="av" id="me-av" style="width:58px;height:58px;font-size:20px"></div>
      <div><b style="font-size:18px" id="me-name"></b>

function load(){
  try{ const raw = localStorage.getItem("vinko_s"); if(raw){ const s = JSON.parse(raw); if(s.ver===1){
    // merge profundo por sección: campos anidados nuevos de DEFAULT_S llegan a guardados antiguos
    const base = structuredClone(DEFAULT_S);
    for(const k in base){
      if(base[k] && typeof base[k]==="object" && !Array.isArray(base[k]) && s[k] && typeof s[k]==="object" && !Array.isArray(s[k]))
        s[k] = Object.assign(base[k], s[k]);
    }
    return Object.assign(base, s);
  } } }catch(e){}
  return structuredClone(DEFAULT_S);
}
function save(){ try{ localStorage.setItem("vinko_s", JSON.stringify(S)); }catch(e){} }

}

const $ = id => document.getElementById(id);
function pct(v, total){ return total>0 ? Math.round(v*100/total) : 0; } // SIEMPRE entero redondeado
function fmtLeft(ms){
  if(ms<=0) return t("time.now");
  const h = Math.floor(ms/H); if(h>=1) return t("time.h",{n:h});
  return t("time.m",{n:Math.max(1,Math.round(ms/60000))});
}
function toast(msg){
  const el = $("toast"); el.textContent = msg; el.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(()=>el.classList.remove("show"), 2200);
}
function confetti(){
  const box = $("confetti");
  for(let i=0;i<36;i++){
    const p = document.createElement("i"); p.className = "cf";
    p.style.left = Math.random()*100+"%";
    p.style.background = AV_COLORS[i%AV_COLORS.length];
    p.style.animationDelay = (Math.random()*0.4)+"s";
    // limpieza garantizada (bug histórico: confeti pegado en pantalla)
    p.addEventListener("animationend", ()=>p.remove());
    box.appendChild(p);
  }
  setTimeout(()=>{ box.innerHTML=""; }, 2600); // red de seguridad
}

function levelOf(xp){ return xp>=4000?3 : xp>=1500?2 : xp>=500?1 : 0; }

function optHtml(p,o,i){
  const total = playersOf(p);

function affSlot(p){

function affHtml(p){

    <span style="flex:1;text-align:left"><b>${t("feed.aff")}</b><br>${t("feed.resp")}</span>

function paintCta(p){
  const sec = document.querySelector(`.pool[data-id="${p.id}"]`); if(!sec) return;
  const slot = sec.querySelector(".ctaslot");
  const betIdx = S.bets[p.id];
  if(p.resolved){
    if(betIdx!==undefined){
      const won = betIdx===p.resolved.winner;
      const pd = (typeof S.paid[p.id]==="object" && S.paid[p.id]) || {share:0, prec:0};
      slot.innerHTML = `<div class="resband ${won?"":"lost"}">${won? t("feed.won",{n:pd.share,p:pd.prec}) : t("feed.lost")}</div>`;
    } else slot.innerHTML = "";
  } else if(betIdx!==undefined){
    slot.innerHTML = `<div class="cta done">${t("feed.betdone",{o:esc(p.opts[betIdx].t)})}</div>`;
  } else {
    slot.innerHTML = `<button class="cta" onclick="openBet('${p.id}')">${t("feed.bet",{n:p.entry})}</button>`;
  }
  // refresca opciones y contadores
  sec.querySelector(".opts").innerHTML = p.opts.map((o,i)=>optHtml(p,o,i)).join("");
}
let IO = null;
function observeFeed(){
  // pausa las animaciones de los pools fuera del viewport (fps en gama media)
  if(!("IntersectionObserver" in window)) return;
  if(IO) IO.disconnect();
  IO = new IntersectionObserver(es=>es.forEach(e=>{
    e.target.classList.toggle("off", !e.isIntersecting);
    // un vídeo por apuesta: reproduce solo el visible (datos y batería)
    const v = e.target.querySelector("video.vv");
    if(v){ if(e.isIntersecting){ v.play().catch(()=>{}); } else v.pause(); }
  }), {root:$("feed"), threshold:0.05});
  document.querySelectorAll(".pool").forEach(s=>IO.observe(s));
}
function renderFeed(keepScroll=true){
  const fd = $("feed");
  const st = keepScroll ? fd.scrollTop : 0;
  fd.innerHTML = "";
  POOLS.forEach(addCard); // arranque sagrado: sin esto el feed queda vacío
  fd.scrollTop = st;
  observeFeed();
}

function pickOpt(i){
  BET.opt = i;
  document.querySelectorAll("#bs-opts .opt").forEach(el=>el.classList.toggle("sel", +el.dataset.i===i));
  updateBetBtn();

function updateBetBtn(){
  const p = BET.pool; if(!p) return;
  const short = S.pts < p.entry;
  const b = $("bs-go");
  if(short){ b.textContent = t("bet.nopts"); b.disabled = true; }
  else if(BET.opt===null){ b.textContent = t("bet.pick"); b.disabled = true; }
  else { b.textContent = t("bet.cta")+" · "+p.entry+" 🪙"; b.disabled = false; }

  if(short && adsLeft()>0){ ad.style.display="block"; ad.textContent = t("bet.ad",{n:AD_RECHARGE_PTS}); }
  else ad.style.display="none";

function confirmBet(){
  const p = BET.pool; if(!p || BET.opt===null || S.pts<p.entry) return;
  // re-validación temporal: nada de apostar en porras cerradas/resueltas ni doble tap
  if(S.bets[p.id]!==undefined || p.resolved || p.closes<=Date.now()){
    closeSheet("betsheet"); toast(t("feed.closed")); return;
  }
  S.pts -= p.entry;
  p.opts[BET.opt].v += 1;
  S.bets[p.id] = BET.opt;
  S.plays += 1; S.xp += 20;
  save(); paintCta(p); paintChips(); confetti();
  const placedOpt = S.bets[p.id];
  bumpReto("p3");
  closeSheet("betsheet");
  track("bet_placed",{id:p.id, opt:placedOpt, entry:p.entry, flash:!!p.flash});
  // tras la primera apuesta, ofrecer (una sola vez) guardar el progreso — sin muro de registro
  if(!S.auth && !S.authPrompted){ S.authPrompted = true; save(); setTimeout(openAuth, 1200); }
}

/* ---------- Supabase (producción; inerte hasta pegar la anon key) ---------- */
const SUPA = {
  url: "https://uarnpxjdccbidgzhhavc.supabase.co",
  anon: "" // Pegar aquí la "anon public" key (Dashboard → Settings → API). Es pública por diseño: RLS protege los datos. JAMÁS la clave de servicio (la secreta).
};
const supaOn = () => !!(SUPA.url && SUPA.anon);
const supaHeaders = tok => ({apikey:SUPA.anon, Authorization:"Bearer "+(tok||SUPA.anon), "Content-Type":"application/json"});
const SUPA_OAUTH = {google:"google", apple:"apple", x:"twitter"}; // TikTok no es proveedor nativo: se queda en mock
function supaSession(){
  // vuelta del OAuth: GoTrue devuelve los tokens en el hash
  const m = location.hash.match(/access_token=([^&]+)/);
  if(!m || !supaOn()) return;
  const tok = decodeURIComponent(m[1]);
  history.replaceState(null, "", location.pathname); // nunca dejar tokens en la URL
  fetch(SUPA.url+"/auth/v1/user", {headers:supaHeaders(tok)}).then(r=>r.json()).then(u=>{
    if(!u || !u.id) return;
    S.supa = {token:tok, id:u.id, email:u.email||null};
    const prov = (u.app_metadata && u.app_metadata.provider) || "google";
    PENDING_PROVIDER = prov==="twitter" ? "x" : prov;
    save(); track("auth_oauth_return",{p:PENDING_PROVIDER});
    if(!S.auth){ // falta la fecha de nacimiento (los proveedores no dan edad)
      openSheet("authsheet");
      $("auth-main").style.display = "none";
      $("auth-dob-step").style.display = "flex";
    }
  }).catch(()=>{});
}
function flushEvents(){
  // analítica → Supabase (tabla events, RLS insert-only); buffer local mientras tanto
  if(!supaOn() || !S.supa || !S.analytics.length) return;
  const batch = S.analytics.splice(0, 100).map(e=>({user_id:S.supa.id, ev:e.ev, props:e, client_ts:new Date(e.t).toISOString()}));
  fetch(SUPA.url+"/rest/v1/events", {method:"POST", headers:supaHeaders(S.supa.token), body:JSON.stringify(batch)})
    .then(r=>{ if(!r.ok) S.analytics.unshift(...batch.map(b=>b.props)); save(); })
    .catch(()=>{ S.analytics.unshift(...batch.map(b=>b.props)); save(); });
}

let PENDING_PROVIDER = null;
function openAuth(){

function authWith(p){

      + "&redirect_to=" + encodeURIComponent(location.origin + location.pathname);

  $("dob-in").focus();

function ageFrom(s){
  const d = new Date(s+"T00:00:00"); if(isNaN(d)) return null;
  const n = new Date();
  let a = n.getFullYear()-d.getFullYear();
  const m = n.getMonth()-d.getMonth();
  if(m<0 || (m===0 && n.getDate()<d.getDate())) a--;
  return a;
}
function authConfirm(){
  const age = ageFrom($("dob-in").value);
  if(age===null || age>120) return;
  if(age<14){ toast(t("auth.under14")); track("auth_under14",{}); return; } // edad mínima de registro (regla de oro 8)
  S.auth = {provider:PENDING_PROVIDER, dob:$("dob-in").value}; // la fecha solo vive en local, jamás en analítica
  S.age18 = age>=18; // 14-17: registrado pero sin afiliación jamás; ≥18: gate pasado
  if(supaOn() && S.supa){ // persistir en el perfil (el trigger SQL re-valida el mínimo de 14)
    fetch(SUPA.url+"/rest/v1/profiles?id=eq."+S.supa.id, {method:"PATCH",
      headers:supaHeaders(S.supa.token), body:JSON.stringify({birth_date:$("dob-in").value, lang:S.lang})}).catch(()=>{});
  }
  save(); closeSheet("authsheet");
  renderFeed(); renderPerfil();
  confetti(); toast(t("auth.done"));
  track("auth_complete",{p:PENDING_PROVIDER, adult:S.age18}); // solo el tramo, sin fecha
}

/* ---------- racha diaria ---------- */
function dailyOpen(){
  const d = today();
  if(S.dailyShown===d) return;
  const y = yesterdayStr();
  if(S.streak.last===y) S.streak.days += 1;
  else if(S.streak.last!==d) S.streak.days = 1; // perder la racha resetea el multiplicador, no el saldo
  S.streak.last = d; S.dailyShown = d;
  const m = streakMult();
  const gain = Math.round(DAILY_BASE*m);
  S.pts += gain; S.xp += 10; save();
  $("dm-title").textContent = t("daily.title",{n:gain});
  $("dm-sub").textContent = t("daily.sub",{d:S.streak.days, m});
  openModal("dailymod"); paintChips();
  track("daily_reward",{day:S.streak.days, mult:m, pts:gain});
}
function streakMult(){ const d = S.streak.days; return d>=14?3 : d>=7?2 : d>=3?1.5 : 1; }

/* ---------- retos diarios (solo capa gratuita; jamás dinero real) ---------- */
const RETO_DEFS = {
  p3:{goal:3, pts:50,  k:"reto.p3"},
  c1:{goal:1, pts:75,  k:"reto.c1"},
  a1:{goal:1, pts:100, k:"reto.a1"},
  s1:{goal:1, pts:50,  k:"reto.s1"}
};
function initRetos(){
  const d = today();
  if(S.retos.date===d && S.retos.list.length) return;
  const ids = Object.keys(RETO_DEFS);
  const seed = new Date().getDate();
  const pick = [0,1,2].map(i => ids[(seed+i)%ids.length]);
  S.retos = {date:d, list: pick.map(id=>({id, prog:0, claimed:false}))};
  save();
}
function bumpReto(id){
  const r = S.retos.list.find(x=>x.id===id); if(!r||r.claimed) return;
  const def = RETO_DEFS[id];
  if(r.prog < def.goal){ r.prog += 1; save(); if(VIEW==="retos") renderRetos(); }
}
function claimReto(id){
  const r = S.retos.list.find(x=>x.id===id); const def = RETO_DEFS[id];
  if(!r || r.claimed || r.prog<def.goal) return;
  r.claimed = true; S.pts += def.pts; S.xp += 15; save();
  paintChips(); confetti(); toast(t("reto.claimed",{n:def.pts}));
  renderRetos(); track("reto_claimed",{id, pts:def.pts});
}
function renderRetos(){
  initRetos();
  $("streak-line").textContent = t("streak.line",{n:S.streak.days});
  $("streak-mult").textContent = t("streak.mult",{m:streakMult()}) + " · " + t("streak.freeze");
  const cal = $("streakcal"); cal.innerHTML = "";
  const names = {es:["L","M","X","J","V","S","D"],pt:["S","T","Q","Q","S","S","D"],en:["M","T","W","T","F","S","S"]}[S.lang]||["L","M","X","J","V","S","D"];
  const dow = (new Date().getDay()+6)%7;
  for(let i=0;i<7;i++){
    const hit = i<=dow && (dow-i)<S.streak.days;
    cal.innerHTML += `<div class="dayb ${hit?"hit":""}"><span class="f">${hit?"🔥":"·"}</span>${names[i]}</div>`;
  }
  $("retolist").innerHTML = S.retos.list.map(r=>{
    const def = RETO_DEFS[r.id];
    const done = r.prog>=def.goal;
    return `<div class="card reto">
      <div class="info"><div class="name">${t(def.k)}</div>
        <div class="pbar"><i style="width:${pct(Math.min(r.prog,def.goal),def.goal)}%"></i></div>
        <div class="muted">${Math.min(r.prog,def.goal)}/${def.goal}</div></div>

/* ---------- grabadora (negociación de códec cross-device; jamás VP9 fijo) ---------- */
function pickMime(){
  const cands = ["video/webm;codecs=vp9","video/webm;codecs=vp8","video/webm","video/mp4;codecs=h264","video/mp4"];
  if(!window.MediaRecorder) return null;
  for(const c of cands){ try{ if(MediaRecorder.isTypeSupported(c)) return c; }catch(e){} }
  return null;
}
let REC = {stream:null, rec:null, on:false, gen:0};
async function openRec(){
  openModal("recmod");
  $("rec-go").textContent = t("rec.start");
  const my = ++REC.gen; // token de generación: evita cámara huérfana si cierran durante el await
  try{
    if(REC.stream){ REC.stream.getTracks().forEach(t=>t.stop()); REC.stream = null; }
    const stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:"user"}, audio:true});
    if(my!==REC.gen || !$("recmod").classList.contains("open")){
      stream.getTracks().forEach(t=>t.stop()); return; // el modal ya se cerró: liberar
    }
    REC.stream = stream;
    $("camprev").srcObject = REC.stream;
    const m = pickMime();
    $("rec-fmt").textContent = m ? t("rec.fmt",{f:m}) : t("rec.nocam");
  }catch(e){
    $("rec-fmt").textContent = t("rec.nocam");
  }
}
function recToggle(){
  if(!REC.stream){ closeRec(); return; }
  if(!REC.on){
    const mime = pickMime(); if(!mime){ toast(t("rec.nocam")); return; }
    try{
      REC.rec = new MediaRecorder(REC.stream, {mimeType:mime});
      REC.chunks = [];
      REC.rec.ondataavailable = e => { if(e.data && e.data.size) REC.chunks.push(e.data); };
      REC.rec.onstop = () => {
        if(REC.chunks.length){
          if(REC_URL) URL.revokeObjectURL(REC_URL);
          REC_URL = URL.createObjectURL(new Blob(REC.chunks, {type:mime}));
        }
      };
      REC.rec.start(); REC.on = true;
      $("rec-go").textContent = t("rec.stop");
    }catch(e){ toast(t("rec.nocam")); }
  } else {
    try{ REC.rec.stop(); }catch(e){}
    REC.on = false; REC_OK = true;
    $("recbtn").classList.add("ok");
    toast(t("rec.saved")); track("video_recorded",{});
    closeRec();
  }
}
function closeRec(){
  REC.gen++; // invalida cualquier getUserMedia en vuelo
  if(REC.stream){ REC.stream.getTracks().forEach(t=>t.stop()); REC.stream = null; }
  REC.on = false; closeModal("recmod");
}

/* ---------- resolución (demo): porras cerradas pagan y puntúan ---------- */
function resolvePools(){
  const changed = [];
  POOLS.forEach(p=>{
    if(!p.resolved && p.closes <= Date.now()){ p.resolved = {winner:0}; changed.push(p.id); }
    if(p.resolved && S.bets[p.id]!==undefined && !S.paid[p.id]){
      const won = S.bets[p.id]===p.resolved.winner;
      if(won){
        const mult = p.flash ? 2 : 1; // ⚡ puntos dobles: SOLO 🪙, jamás la PRECISIÓN (§7.1)
        const share = Math.round(potOf(p) / Math.max(1,p.opts[p.resolved.winner].v)) * mult;
        // precisión ponderada por dificultad: acertar contra la mayoría vale más
        const total = playersOf(p), mine = p.opts[p.resolved.winner].v;
        const weight = 1 + (1 - mine/Math.max(1,total));
        const precGain = Math.round(100*weight);
        S.pts += share; S.hits += 1; S.prec += precGain; S.xp += 40;
        S.paid[p.id] = {share, prec:precGain};
        bumpReto("a1");
        track("pool_won",{id:p.id, share, flash:!!p.flash});
      } else {
        S.paid[p.id] = {share:0, prec:0};
        track("pool_lost",{id:p.id});
      }
      if(!changed.includes(p.id)) changed.push(p.id);
      save();
    }
  });
  return changed;
}

/* ---------- boot ---------- */
function boot(){
  // restaurar porras propias persistidas (objetos completos en S.myPools)
  S.myPools.forEach(p=>{
    if(!p || !p.id || POOLS.find(x=>x.id===p.id)) return;
    if(p.vs && p.vs.startsWith("blob:")) delete p.vs; // los objectURL mueren con la sesión
    POOLS.unshift(p);
  });
  applyI18n();
  resolvePools();
  renderFeed(false);
  paintChips();
  renderRetos();
  dailyOpen();
  track("app_open",{lang:S.lang});
  if("serviceWorker" in navigator && location.protocol.startsWith("http")){
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  }
  setInterval(tick, 30000);
  setInterval(simulateActivity, 22000); // DEMO: actividad viva
  supaSession(); // vuelta de OAuth (limpia el hash de tokens ANTES del router)
  routeHash();   // deep-link de entrada (#p/<id> o #r/<code>)
}
function tick(){
  if(document.hidden) return; // sin trabajo en background
  flushEvents();
  resolveDuels();
  const changed = resolvePools();
  changed.forEach(id=>{
    const p = POOLS.find(x=>x.id===id); if(!p) return;
    paintCta(p);
    if(BET.pool && BET.pool.id===id) closeSheet("betsheet"); // la porra del sheet acaba de cerrar
  });
  if(changed.length) paintChips();
  // solo el countdown cambia con el tiempo: textContent, sin reconstruir innerHTML
  document.querySelectorAll(".pool").forEach(sec=>{
    const p = POOLS.find(x=>x.id===sec.dataset.id); if(!p) return;
    const el = sec.querySelector(".left");
    if(el) el.textContent = p.resolved ? t("feed.closed") : t("feed.closes",{t:fmtLeft(p.closes-Date.now())});
  });
}
boot();
</script>
</body>
</html>
